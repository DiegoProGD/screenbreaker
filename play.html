<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ScreenBreaker</title>

<style>

:root{
--bg:#f5f3ef;
--paper:#fffefa;
--ink:#252525;
--line:#e7e1d9;
--accent:#7657a5;
}

*{
box-sizing:border-box;
}

body{

margin:0;

background:var(--bg);

font-family:system-ui,sans-serif;

color:#222;

transition:.2s;

}

.topbar{

padding:15px;

background:white;

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:10px;

border-bottom:1px solid var(--line);

}

#message{

text-align:center;

font-size:2rem;

font-weight:bold;

padding:20px;

}

#screens{

width:min(1000px,95%);

margin:auto;

display:grid;

gap:20px;

padding:20px;

}

.screen{

height:220px;

background:#ddd;

border-radius:30px;

display:flex;

align-items:center;

justify-content:center;

font-size:3rem;

font-weight:bold;

position:relative;

user-select:none;

cursor:pointer;

transition:.2s;

}

.corner{

position:absolute;

top:15px;

left:15px;

width:24px;

height:24px;

border-radius:6px;

}

.normalIndicator{

background:white;

border:1px solid #888;

}

.holdIndicator{

background:gold;

}

.waiting{

outline:8px solid white;

}

.hold{

outline:8px solid gold;

}

</style>

</head>

<body>

<div class="topbar">

<div id="levelName">
Loading...
</div>

<div id="attempts">
Attempts: 1
</div>

<div id="totalAttempts">
Total: 0
</div>

</div>

<div id="message">

Get Ready...

</div>

<div id="screens"></div>

<script>

const keyMap = {

d:1,
f:2,
g:3,
h:4,
j:5,
k:6

};

function getColor(color){

const colors={

red:"#ff4d4d",
blue:"#4d7dff",
green:"#47d147",
purple:"#a855f7",
pink:"#ff5ca8",
orange:"#ff9d42",
yellow:"#ffe14d",
cyan:"#36d4ff",
lime:"#99ff66",
gold:"#ffd700",
silver:"#c0c0c0",
navy:"#001f8f",
teal:"#008080",
maroon:"#800000",
olive:"#808000",
white:"#ffffff",
black:"#222222",
gray:"#888888",
grey:"#888888"

};

return colors[
String(color)
.toLowerCase()
] || color;

}

const code =

localStorage.getItem(
"currentLevelCode"
);

if(!code){

document.body.innerHTML=

"<h1>No level loaded.</h1>";

throw Error();

}

let level={};

let events=[];

let currentEvent=0;

let waiting=null;

let dead=false;

let startTime=0;

let attempt=1;

let themeColor="#7657a5";

parseLevel();

function parseLevel(){

const parts=
code.split("|");

level={

name:parts[1],

color:parts[2],

sections:Number(parts[3]),

length:Number(parts[4]),

reaction:Number(parts[5]),

practice:Number(parts[6])

};

themeColor=
getColor(
level.color
);

document.body.style.background=
themeColor;

document.querySelector(
".topbar"
).style.background=
themeColor;

document.querySelector(
".topbar"
).style.color=
"white";

document.getElementById(
"levelName"
).textContent=
level.name;

const remaining=
parts.slice(7)
.join("|");

if(remaining.trim()){

events=
remaining
.split(";")
.filter(Boolean)
.map(raw=>{

const p=
raw.split(",");

return{

time:Number(p[0]),
screen:Number(p[1]),
type:p[2],
duration:Number(p[3])

};

});

}

buildGrid();

loadAttempts();

setTimeout(
startLevel,
1000
);

}

function buildGrid(){

const container=
document.getElementById(
"screens"
);

let cols=2;

if(level.sections<=3){
cols=level.sections;
}

if(level.sections>=5){
cols=3;
}

container.style.gridTemplateColumns=
`repeat(${cols},1fr)`;

container.innerHTML="";

for(
let i=1;
i<=level.sections;
i++
){

const div=
document.createElement(
"div"
);

div.className=
"screen";

div.dataset.screen=
i;

div.innerHTML=

`
${i}

<div
class="
corner
normalIndicator
">
</div>
`;

div.onclick=
()=>hit(i);

container.appendChild(
div
);

}

}

  function startLevel(){

document.getElementById(
"message"
).textContent = "";

currentEvent = 0;

waiting = null;

dead = false;

startTime =

performance.now()

-

(
level.practice
*
1000
);

requestAnimationFrame(
gameLoop
);

}

function gameLoop(){

if(dead) return;

const elapsed =

(
performance.now()
-
startTime
)/1000;

while(

currentEvent <
events.length

&&

elapsed >=
events[currentEvent].time

){

activateEvent(
events[currentEvent]
);

currentEvent++;

}

requestAnimationFrame(
gameLoop
);

}

function activateEvent(event){

const tile =

document.querySelector(

`[data-screen="${event.screen}"]`

);

if(!tile) return;

tile.classList.add(
"waiting"
);

tile.style.background =
themeColor;

const corner =

tile.querySelector(
".corner"
);

corner.className =

"corner " +

(
event.type==="H"

?

"holdIndicator"

:

"normalIndicator"

);

waiting = {

event,
tile,
corner

};

setTimeout(()=>{

if(

waiting &&

waiting.event === event

){

die();

}

},
level.reaction * 1000
);

}

function hit(screen){

if(dead) return;

if(!waiting) return;

if(

waiting.event.screen

!==

screen

){

die();

return;

}

if(

waiting.event.type

=== "N"

){

clearCurrent();

checkComplete();

return;

}

startHold();

}

function startHold(){

const event =
waiting.event;

waiting.tile.classList.add(
"hold"
);

const started =
performance.now();

function release(){

document.removeEventListener(
"mouseup",
release
);

const held =

(
performance.now()
-
started
)/1000;

if(
held <
event.duration
){

die();

return;

}

clearCurrent();

checkComplete();

}

document.addEventListener(
"mouseup",
release
);

}

function clearCurrent(){

if(!waiting)
return;

waiting.tile.classList.remove(
"waiting"
);

waiting.tile.classList.remove(
"hold"
);

waiting.tile.style.background =
"#ddd";

waiting = null;

}

function checkComplete(){

if(

currentEvent >=
events.length

&&

!waiting

){

document.getElementById(
"message"
).textContent =

"LEVEL COMPLETE";

dead = true;

}

}

function die(){

if(dead)
return;

dead = true;

increaseAttempts();

document.getElementById(
"message"
).textContent =

"YOU DIED";

setTimeout(

restartLevel,

1000

);

}

function restartLevel(){

document
.querySelectorAll(
".screen"
)

.forEach(tile=>{

tile.classList.remove(
"waiting"
);

tile.classList.remove(
"hold"
);

tile.style.background =
"#ddd";

});

startLevel();

}

document.addEventListener(

"keydown",

event=>{

const screen =

keyMap[
event.key.toLowerCase()
];

if(screen){

hit(screen);

}

}

);

function loadAttempts(){

const key =

"sb_attempts_" +
code;

const total =

Number(

localStorage.getItem(
key
)

||

0

);

document.getElementById(
"totalAttempts"
).textContent =

"Total: " +
total;

document.getElementById(
"attempts"
).textContent =

"Attempts: " +
attempt;

}

function increaseAttempts(){

attempt++;

const key =

"sb_attempts_" +
code;

let total =

Number(

localStorage.getItem(
key
)

||

0

);

total++;

localStorage.setItem(
key,
total
);

document.getElementById(
"attempts"
).textContent =

"Attempts: " +
attempt;

document.getElementById(
"totalAttempts"
).textContent =

"Total: " +
total;

}

</script>

</body>
</html>
