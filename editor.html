<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenBreaker Editor</title>

<style>
:root{
  --bg:#f5f3ef;
  --paper:#fffefa;
  --ink:#252525;
  --muted:#77736d;
  --accent:#7657a5;
  --accent-light:#eee8f6;
  --line:#e7e1d9;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--ink);
}

header{
  padding:40px 20px;
  text-align:center;
}

h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:3rem;
  font-weight:500;
}

.subtitle{
  color:var(--muted);
  margin-top:8px;
}

main{
  width:min(1000px, calc(100% - 30px));
  margin:auto;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  font:inherit;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

button{
  cursor:pointer;
  border:none;
  background:var(--accent);
  color:white;
  padding:12px 16px;
  border-radius:12px;
  font-size:1rem;
  transition:.15s;
}

button:hover{
  transform:translateY(-2px);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  text-align:left;
}

tr{
  border-bottom:1px solid var(--line);
}

.remove-btn{
  background:#d9534f;
}

.code-box{
  width:100%;
  min-height:140px;
  resize:vertical;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  font-family:monospace;
  font-size:.9rem;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}
</style>
</head>
<body>

<header>
<h1>ScreenBreaker Editor</h1>
<p class="subtitle">Create a level and generate a share code.</p>
</header>

<main>

<div class="card">
<div class="grid">

<div>
<label>Level Name</label>
<input id="levelName" value="My Level">
</div>

<div>
<label>Main Color</label>
<input id="mainColor" type="text" value="green">
</div>

<div>
<label>Sections</label>
<select id="sections">
<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
<option>5</option>
<option>6</option>
</select>
</div>

</div>
</div>

<div class="card">

<h2>Add Event</h2>

<div class="grid">

<div>
<label>Time (seconds)</label>
<input id="eventTime" type="number" step="0.1" value="1">
</div>

<div>
<label>Screen</label>
<select id="eventScreen">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
</select>
</div>

<div>
<label>Type</label>
<select id="eventType">
<option value="N">Normal</option>
<option value="H">Hold</option>
</select>
</div>

<div>
<label>Hold Duration</label>
<input id="eventDuration" type="number" step="0.1" value="1">
</div>

</div>

<div class="actions">
<button onclick="addEvent()">
Add Event
</button>
</div>

</div>

<div class="card">

<h2>Level Events</h2>

<table>
<thead>
<tr>
<th>Time</th>
<th>Screen</th>
<th>Type</th>
<th>Duration</th>
<th></th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>

</div>

<div class="card">

<h2>Generated Code</h2>

<textarea
class="code-box"
id="output"
readonly
></textarea>

<div class="actions">

<button onclick="generateCode()">
Generate Code
</button>

<button onclick="copyCode()">
Copy Code
</button>

</div>

</div>

</main>

<script>

let events=[];

function addEvent(){

  const event = {
    time:Number(document.getElementById("eventTime").value),
    screen:Number(document.getElementById("eventScreen").value),
    type:document.getElementById("eventType").value,
    duration:Number(document.getElementById("eventDuration").value)
  };

  events.push(event);

  events.sort((a,b)=>a.time-b.time);

  renderEvents();
}

function renderEvents(){

  const table=document.getElementById("eventTable");

  table.innerHTML="";

  events.forEach((event,index)=>{

    const row=document.createElement("tr");

    row.innerHTML=`
      <td>${event.time}</td>
      <td>${event.screen}</td>
      <td>${event.type==="N"?"Normal":"Hold"}</td>
      <td>${event.duration}</td>
      <td>
        <button
          class="remove-btn"
          onclick="removeEvent(${index})"
        >
          Delete
        </button>
      </td>
    `;

    table.appendChild(row);

  });
}

function removeEvent(index){

  events.splice(index,1);

  renderEvents();
}

function generateCode(){

  const levelName=
  document.getElementById("levelName").value;

  const color=
  document.getElementById("mainColor").value;

  const sections=
  document.getElementById("sections").value;

  let code=
  `SB1|${levelName}|${color}|${sections}|`;

  const eventString=
  events.map(event=>
    `${event.time},${event.screen},${event.type},${event.duration}`
  ).join(";");

  code+=eventString;

  document.getElementById("output")
  .value=code;
}

function copyCode(){

  const output=
  document.getElementById("output");

  output.select();

  navigator.clipboard.writeText(output.value);

  alert("Code copied!");
}

</script>

</body>
</html>
