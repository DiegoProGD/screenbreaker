<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ScreenBreaker Editor</title>

<style>
:root{
--bg:#f5f3ef;
--paper:#fffefa;
--ink:#252525;
--accent:#7657a5;
--line:#e7e1d9;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
font-family:system-ui,sans-serif;
color:var(--ink);
}

main{
width:min(900px,calc(100% - 30px));
margin:auto;
padding:20px;
}

h1{
text-align:center;
font-family:Georgia,serif;
font-weight:500;
}

.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--line);
font:inherit;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
cursor:pointer;
}

#screens{
display:grid;
gap:10px;
margin-top:15px;
}

.screen{
height:120px;
background:#ece7e0;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
cursor:pointer;
}

.screen:hover{
background:#ddd6cb;
}

#events{
display:grid;
gap:10px;
}

.event{
background:white;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
}

#timeDisplay{
font-size:2rem;
text-align:center;
margin-bottom:10px;
}

textarea{
height:160px;
font-family:monospace;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}
</style>
</head>

<body>

<main>

<h1>ScreenBreaker Editor</h1>

<div class="card">

<div class="grid">

<div>
<label>Level Name</label>
<input id="levelName" value="My Level">
</div>

<div>
<label>Main Color</label>
<input id="mainColor" value="Green">
</div>

<div>
<label>Sections</label>

<select id="sections">

<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
<option>5</option>
<option>6</option>

</select>

</div>

<div>
<label>Level Length (Seconds)</label>
<input
id="levelLength"
type="number"
value="60"
min="1">
</div>

<div>
<label>Reaction Time</label>
<input
id="reactionTime"
type="number"
step="0.1"
value="1">
</div>

<div>
<label>Practice Start</label>
<input
id="practiceStart"
type="number"
value="0"
step="0.1">
</div>

</div>

</div>

<div class="card">

<div id="timeDisplay">
0.0s / 60s
</div>

<input
id="timeline"
type="range"
min="0"
max="60"
step="0.1"
value="0">

<br><br>

<select id="noteType">

<option value="N">
Normal
</option>

<option value="H">
Hold
</option>

</select>

<br><br>

<input
id="holdDuration"
type="number"
value="1"
step="0.1"
placeholder="Hold Duration">

</div>

<div class="card">

<h2>Screens</h2>

<div id="screens"></div>

</div>

<div class="card">

<h2>Events</h2>

<div id="events"></div>

</div>

<div class="card">

<h2>SB1 Code</h2>

<textarea
id="code"
readonly></textarea>

<div class="actions">

<button onclick="generateCode()">
Generate Code
</button>

<button onclick="copyCode()">
Copy Code
</button>

<button onclick="saveProject()">
Save Project
</button>

<input
type="file"
id="loader"
hidden>

<button onclick="document.getElementById('loader').click()">
Load Project
</button>

</div>

</div>

<script>

const events = [];

const levelNameInput =
document.getElementById(
"levelName"
);

const mainColorInput =
document.getElementById(
"mainColor"
);

const sectionsInput =
document.getElementById(
"sections"
);

const levelLengthInput =
document.getElementById(
"levelLength"
);

const reactionInput =
document.getElementById(
"reactionTime"
);

const practiceInput =
document.getElementById(
"practiceStart"
);

const timeline =
document.getElementById(
"timeline"
);

const timeDisplay =
document.getElementById(
"timeDisplay"
);

const eventsContainer =
document.getElementById(
"events"
);

const codeBox =
document.getElementById(
"code"
);

const loader =
document.getElementById(
"loader"
);

function buildScreens(){

const count =
Number(
sectionsInput.value
);

const screens =
document.getElementById(
"screens"
);

screens.innerHTML = "";

let cols = 2;

if(count <= 3){
cols = count;
}

if(count >= 5){
cols = 3;
}

screens.style.gridTemplateColumns =
`repeat(${cols},1fr)`;

for(
let i=1;
i<=count;
i++
){

const div =
document.createElement(
"div"
);

div.className =
"screen";

div.textContent =
"Screen " + i;

div.onclick =
()=> addEvent(i);

screens.appendChild(
div
);

}

}

  function addEvent(screen){

events.push({

time:Number(
timeline.value
),

screen:screen,

type:
document
.getElementById(
"noteType"
)
.value,

duration:Number(
document
.getElementById(
"holdDuration"
)
.value

)

});

renderEvents();

}

function renderEvents(){

events.sort(
(a,b)=>
a.time-b.time
);

eventsContainer.innerHTML="";

events.forEach(
(event,index)=>{

const div =
document.createElement(
"div"
);

div.className=
"event";

div.innerHTML=

`
<strong>
${event.time}s
</strong>

•
Screen ${event.screen}

•
${
event.type==="H"
?
`Hold (${event.duration}s)`
:
"Normal"
}

<button
style="
float:right;
background:#c44;
"
onclick="
removeEvent(${index})
">

Delete

</button>
`;

eventsContainer.appendChild(
div
);

});

}

function removeEvent(index){

events.splice(
index,
1
);

renderEvents();

}

function generateCode(){

const eventString =

events.map(

e=>

`${e.time},${e.screen},${e.type},${e.duration}`

).join(";");

const code =

`SB1|`

+

`${levelNameInput.value}|`

+

`${mainColorInput.value}|`

+

`${sectionsInput.value}|`

+

`${levelLengthInput.value}|`

+

`${reactionInput.value}|`

+

`${practiceInput.value}|`

+

eventString;

codeBox.value =
code;

}

function copyCode(){

generateCode();

navigator
.clipboard
.writeText(
codeBox.value
);

alert(
"SB1 code copied!"
);

}

function saveProject(){

const project = {

levelName:
levelNameInput.value,

mainColor:
mainColorInput.value,

sections:
sectionsInput.value,

levelLength:
levelLengthInput.value,

reactionTime:
reactionInput.value,

practiceStart:
practiceInput.value,

events

};

const blob =
new Blob(

[
JSON.stringify(
project,
null,
2
)
],

{
type:
"application/json"
}

);

const link =
document
.createElement(
"a"
);

link.href =
URL.createObjectURL(
blob
);

link.download =

(levelNameInput.value ||
"project")

+

".json";

link.click();

}

loader.addEventListener(

"change",

event=>{

const file =
event.target.files[0];

if(!file){
return;
}

const reader =
new FileReader();

reader.onload =
()=>{

const data =
JSON.parse(
reader.result
);

levelNameInput.value =
data.levelName ||
"My Level";

mainColorInput.value =
data.mainColor ||
"Green";

sectionsInput.value =
data.sections ||
4;

levelLengthInput.value =
data.levelLength ||
60;

reactionInput.value =
data.reactionTime ||
1;

practiceInput.value =
data.practiceStart ||
0;

events.length = 0;

if(data.events){

data.events.forEach(
e=>
events.push(e)
);

}

buildScreens();

renderEvents();

updateTimelineRange();

};

reader.readAsText(
file
);

}

);

function updateTimelineRange(){

timeline.max =
levelLengthInput.value;

updateTimeDisplay();

}

function updateTimeDisplay(){

timeDisplay.textContent =

timeline.value +

"s / " +

levelLengthInput.value +

"s";

}

timeline.addEventListener(

"input",

updateTimeDisplay

);

levelLengthInput.addEventListener(

"input",

updateTimelineRange

);

sectionsInput.addEventListener(

"change",

buildScreens

);

buildScreens();

updateTimelineRange();

renderEvents();

</script>

</body>
</html>
