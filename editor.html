<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ScreenBreaker Editor</title>

<style>
:root{
--bg:#f5f3ef;
--paper:#fffefa;
--ink:#252525;
--muted:#77736d;
--accent:#7657a5;
--line:#e7e1d9;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
font-family:system-ui,sans-serif;
color:var(--ink);
}

main{
width:min(900px,calc(100% - 30px));
margin:auto;
padding:20px;
}

h1{
font-family:Georgia,serif;
font-weight:500;
text-align:center;
}

.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid var(--line);
border-radius:12px;
font:inherit;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#timeDisplay{
font-size:2rem;
text-align:center;
margin-bottom:10px;
}

#screens{
display:grid;
gap:10px;
margin-top:15px;
}

.screen{
height:120px;
background:#ece7e0;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
cursor:pointer;
user-select:none;
transition:.15s;
}

.screen:hover{
background:#ddd6cb;
}

#events{
display:grid;
gap:10px;
}

.event{
background:white;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
}

textarea{
height:160px;
font-family:monospace;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}
</style>
</head>

<body>

<main>

<h1>ScreenBreaker Editor</h1>

<div class="card">

<div class="grid">

<div>
<label>Level Name</label>
<input id="name" value="My Level">
</div>

<div>
<label>Main Color</label>
<input id="color" value="green">
</div>

<div>
<label>Sections</label>

<select id="sections">
<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
<option>5</option>
<option>6</option>
</select>

</div>

<div>
<label>Level Length (seconds)</label>
<input
id="levelLength"
type="number"
value="60"
min="1">
</div>

<div>
<label>Reaction Time</label>
<input
id="reaction"
type="number"
step="0.1"
value="1">
</div>

<div>
<label>Practice Start</label>
<input
id="practiceStart"
type="number"
step="0.1"
value="0">
</div>

</div>

</div>

<div class="card">

<div id="timeDisplay">
0.0s / 60s
</div>

<input
id="timeline"
type="range"
min="0"
max="60"
step="0.1"
value="0">

<br><br>

<select id="noteType">

<option value="N">
Normal
</option>

<option value="H">
Hold
</option>

</select>

<br><br>

<input
id="holdDuration"
type="number"
step="0.1"
value="1"
placeholder="Hold Duration">

</div>

<div class="card">

<h2>Screens</h2>

<div id="screens"></div>

</div>

<div class="card">

<h2>Events</h2>

<div id="events"></div>

</div>

<div class="card">

<h2>SB1 Code</h2>

<textarea
id="code"
readonly></textarea>

<div class="actions">

<button onclick="generateCode()">
Generate Code
</button>

<button onclick="copyCode()">
Copy Code
</button>

<button onclick="saveProject()">
Save Project
</button>

<input
type="file"
id="loader"
hidden>

<button onclick="loader.click()">
Load Project
</button>

</div>

</div>

<script>

const events = [];

function buildScreens(){

const count =
Number(sections.value);

const screens =
document.getElementById(
"screens"
);

screens.innerHTML="";

let cols = 2;

if(count<=3) cols=count;
if(count>=5) cols=3;

screens.style.gridTemplateColumns =
`repeat(${cols},1fr)`;

for(
let i=1;
i<=count;
i++
){

const div =
document.createElement(
"div"
);

div.className =
"screen";

div.textContent =
"Screen " + i;

div.onclick =
()=> addEvent(i);

screens.appendChild(div);

}

}

  function addEvent(screen){

events.push({

time:Number(
timeline.value
),

screen,

type:
document
.getElementById(
"noteType"
)
.value,

duration:Number(
document
.getElementById(
"holdDuration"
)
.value

)

});

renderEvents();

}

function renderEvents(){

const container =
document.getElementById(
"events"
);

container.innerHTML="";

events.sort(
(a,b)=>
a.time-b.time
);

events.forEach(
(event,index)=>{

const div =
document.createElement(
"div"
);

div.className =
"event";

div.innerHTML =

`
<strong>
${event.time}s
</strong>

•
Screen ${event.screen}

•
${
event.type === "H"
?
`Hold (${event.duration}s)`
:
"Normal"
}

<button
style="
float:right;
background:#c44;
"
onclick="
removeEvent(${index})
">

Delete

</button>

`;

container.appendChild(
div
);

});

}

function removeEvent(i){

events.splice(i,1);

renderEvents();

}

function generateCode(){

const code =

`SB1|`

+

`${name.value}|`

+

`${color.value}|`

+

`${sections.value}|`

+

`${levelLength.value}|`

+

`${reaction.value}|`

+

`${practiceStart.value}|`

+

events.map(

e=>

`${e.time},${e.screen},${e.type},${e.duration}`

).join(";");

document
.getElementById(
"code"
)
.value =
code;

}

function copyCode(){

generateCode();

navigator.clipboard
.writeText(

document
.getElementById(
"code"
)
.value

);

alert(
"SB1 code copied!"
);

}

function saveProject(){

const data = {

name:
name.value,

color:
color.value,

sections:
sections.value,

levelLength:
levelLength.value,

reaction:
reaction.value,

practiceStart:
practiceStart.value,

events

};

const blob =
new Blob(

[
JSON.stringify(
data,
null,
2
)
],

{
type:
"application/json"
}

);

const a =
document.createElement(
"a"
);

a.href =
URL.createObjectURL(
blob
);

a.download =
`${name.value}.json`;

a.click();

}

loader.addEventListener(

"change",

event=>{

const file =
event.target.files[0];

if(!file)
return;

const reader =
new FileReader();

reader.onload =
()=>{

const data =

JSON.parse(
reader.result
);

name.value =
data.name;

color.value =
data.color;

sections.value =
data.sections;

levelLength.value =
data.levelLength;

reaction.value =
data.reaction;

practiceStart.value =
data.practiceStart;

events.length = 0;

data.events.forEach(
e=>events.push(e)
);

buildScreens();

renderEvents();

updateTimelineRange();

};

reader.readAsText(
file
);

}

);

function updateTimelineRange(){

timeline.max =
levelLength.value;

updateTimeDisplay();

}

function updateTimeDisplay(){

timeDisplay.textContent =

timeline.value +

"s / " +

levelLength.value +

"s";

}

timeline.addEventListener(

"input",

updateTimeDisplay

);

levelLength.addEventListener(

"input",

updateTimelineRange

);

sections.addEventListener(

"change",

buildScreens

);

buildScreens();

updateTimelineRange();

renderEvents();

</script>

</body>
</html>
