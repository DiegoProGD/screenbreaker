<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ScreenBreaker Editor</title>

<style>

:root{
--bg:#f5f3ef;
--paper:#fffefa;
--ink:#252525;
--muted:#77736d;
--accent:#7657a5;
--line:#e7e1d9;
}

body{
margin:0;
background:var(--bg);
font-family:system-ui;
color:var(--ink);
}

main{
width:min(900px,calc(100% - 30px));
margin:auto;
padding:20px;
}

.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

h1{
font-family:Georgia,serif;
font-weight:500;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid var(--line);
border-radius:12px;
box-sizing:border-box;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#timeDisplay{
font-size:2rem;
text-align:center;
margin-bottom:15px;
}

#screens{
display:grid;
gap:10px;
margin-top:15px;
}

.screen{
background:#ece7e0;
height:120px;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
cursor:pointer;
user-select:none;
}

.screen:hover{
background:#ddd6cb;
}

#events{
display:grid;
gap:10px;
}

.event{
background:white;
border:1px solid var(--line);
border-radius:12px;
padding:10px;
}

textarea{
height:150px;
font-family:monospace;
}

</style>
</head>
<body>

<main>

<h1>ScreenBreaker Editor</h1>

<div class="card">

<div class="grid">

<div>
<label>Name</label>
<input id="name" value="My Level">
</div>

<div>
<label>Main Color</label>
<input id="color" value="green">
</div>

<div>
<label>Sections</label>

<select id="sections">

<option>1</option>
<option>2</option>
<option>3</option>
<option selected>4</option>
<option>5</option>
<option>6</option>

</select>

</div>

<div>
<label>Reaction Time</label>
<input
id="reaction"
type="number"
step="0.1"
value="1"
>
</div>

</div>

</div>

<div class="card">

<div id="timeDisplay">

0.0s

</div>

<input
id="timeline"
type="range"
min="0"
max="60"
step="0.1"
value="0"
>

<br><br>

<select id="noteType">

<option value="N">
Normal
</option>

<option value="H">
Hold
</option>

</select>

<br><br>

<input
id="holdDuration"
type="number"
step="0.1"
value="1"
>

</div>

<div class="card">

<h2>Screens</h2>

<div id="screens"></div>

</div>

<div class="card">

<h2>Events</h2>

<div id="events"></div>

</div>

<div class="card">

<h2>SB1 Code</h2>

<textarea
id="code"
readonly
></textarea>

<br><br>

<button onclick="generateCode()">
Generate Code
</button>

<button onclick="copyCode()">
Copy Code
</button>

</div>

</main>

<script>

const events=[];

function buildScreens(){

const count=
Number(
document
.getElementById(
"sections"
)
.value
);

const screens=
document
.getElementById(
"screens"
);

screens.innerHTML="";

let cols=2;

if(count<=3)
cols=count;

if(count>=5)
cols=3;

screens.style.gridTemplateColumns=
`repeat(${cols},1fr)`;

for(
let i=1;
i<=count;
i++
){

const div=
document.createElement(
"div"
);

div.className=
"screen";

div.textContent=
"Screen "+i;

div.onclick=
()=>addEvent(i);

screens.appendChild(
div
);

}

}

function addEvent(screen){

events.push({

time:Number(
document
.getElementById(
"timeline"
)
.value
),

screen,

type:
document
.getElementById(
"noteType"
)
.value,

duration:Number(
document
.getElementById(
"holdDuration"
)
.value
)

});

renderEvents();

}

function renderEvents(){

const container=
document.getElementById(
"events"
);

container.innerHTML="";

events.sort(
(a,b)=>a.time-b.time
);

events.forEach(
(event,index)=>{

const div=
document.createElement(
"div"
);

div.className=
"event";

div.innerHTML=`
${event.time}s
•
Screen ${event.screen}
•
${event.type==="H"?"Hold":"Normal"}

<button
style="float:right"
onclick="
removeEvent(
${index}
)
">
Delete
</button>
`;

container.appendChild(
div
);

});

}

function removeEvent(i){

events.splice(i,1);

renderEvents();

}

function generateCode(){

const code=

`SB1|${name.value}|${color.value}|${sections.value}|${reaction.value}|`

+

events.map(

e=>

`${e.time},${e.screen},${e.type},${e.duration}`

).join(";");

document
.getElementById(
"code"
)
.value=
code;

}

function copyCode(){

generateCode();

navigator.clipboard.writeText(
document
.getElementById(
"code"
)
.value
);

alert(
"SB1 code copied!"
);

}

timeline.addEventListener(
"input",
()=>{
timeDisplay.textContent=
timeline.value+"s";
}
);

sections.addEventListener(
"change",
buildScreens
);

buildScreens();

</script>

</body>
</html>
